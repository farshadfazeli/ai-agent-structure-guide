                            <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Professional Quiz</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap");

    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --primary: #3157d5;
      --primary-dark: #203ea0;
      --border: #e1e6ef;
      --success: #138654;
      --success-bg: #eaf8f1;
      --danger: #c43d4c;
      --danger-bg: #fff1f2;
      --warning: #a66a00;
      --warning-bg: #fff8e7;
      --shadow: 0 18px 45px rgba(25, 42, 75, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 90% 0%, rgba(49, 87, 213, 0.14), transparent 30rem),
        linear-gradient(135deg, #f9fbff, var(--bg));
      font-family: "Vazirmatn", Tahoma, sans-serif;
      line-height: 1.8;
    }

    .container {
      width: min(100% - 28px, 1050px);
      margin: auto;
    }

    header {
      padding: 42px 0 28px;
      text-align: center;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 999px;
      color: var(--primary);
      background: #e9efff;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .language-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 15px rgba(25, 42, 75, 0.06);
    }

    .language-box button {
      min-width: 86px;
      padding: 8px 12px;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .language-box button:hover,
    .language-box button.active {
      color: #fff;
      background: var(--primary);
      transform: none;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.4;
    }

    .intro {
      max-width: 760px;
      margin: auto;
      color: var(--muted);
    }

    .quiz-card,
    .result-card {
      margin-bottom: 30px;
      padding: clamp(20px, 4vw, 40px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .question {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .question:first-child {
      padding-top: 0;
    }

    .question:last-child {
      border-bottom: 0;
    }

    .question-title {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 17px;
      font-weight: 700;
      font-size: 1.04rem;
    }

    .question-number {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: #fff;
      background: var(--primary);
      font-size: 0.9rem;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .option:hover {
      border-color: var(--primary);
      background: #f6f8ff;
    }

    .option.selected {
      border-color: var(--primary);
      background: #edf2ff;
    }

    .option input {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-top: 5px;
      accent-color: var(--primary);
    }

    .empty-answer {
      padding: 10px;
      border-radius: 12px;
      background: var(--warning-bg);
      outline: 2px solid #e7ad35;
      margin-top: 4%;
    }

    .question.correct-answer {
      outline: 2px solid var(--success);
      outline-offset: 4px;
      border-radius: 12px;
      background: var(--success-bg);
      margin-top: 4%;
      margin-bottom: 2%;
    }

    .question.wrong-answer {
      outline: 2px solid var(--danger);
      outline-offset: 4px;
      border-radius: 12px;
      background: var(--danger-bg);
      margin-top: 4%;
      margin-bottom: 2%;

    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      padding: 13px 28px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .main-submit {
      min-width: 260px;
    }

    .result-card {
      display: none;
    }

    .result-card.show {
      display: block;
      animation: reveal 0.45s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .score {
      text-align: center;
    }

    .score-circle {
      display: grid;
      place-items: center;
      width: 150px;
      height: 150px;
      margin: 0 auto 15px;
      border: 10px solid #dce5ff;
      border-radius: 50%;
      color: var(--primary);
      font-size: 2rem;
      font-weight: 800;
    }

    .score h2 {
      margin: 0;
    }

    .score p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .feedback {
      margin-top: 30px;
    }

    .feedback h2 {
      font-size: 1.3rem;
    }

    .wrong-item {
      margin: 14px 0;
      padding: 18px;
      border-right: 5px solid var(--danger);
      border-radius: 12px;
      background: var(--danger-bg);
    }

    html[dir="ltr"] .wrong-item {
      border-right: 0;
      border-left: 5px solid var(--danger);
    }

    .wrong-item strong {
      display: block;
      margin-bottom: 8px;
    }

    .wrong-item p {
      margin: 6px 0;
    }

    .wrong-item .correct {
      color: var(--success);
      font-weight: 800;
    }

    .all-correct {
      padding: 18px;
      border-radius: 12px;
      color: var(--success);
      background: var(--success-bg);
      text-align: center;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 18px, 1050px);
      }

      header {
        padding-top: 25px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
        margin-bottom: 25px;
      }

      .language-box {
        align-self: center;
      }

      .quiz-card,
      .result-card {
        border-radius: 18px;
      }

      .question-title {
        font-size: 0.97rem;
      }

      .main-submit {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="topbar">
        <span class="badge" id="badge"></span>

        <div class="language-box">
          <button id="faButton" type="button" onclick="changeLanguage('fa')">
            فارسی
          </button>

          <button id="enButton" type="button" onclick="changeLanguage('en')">
            English
          </button>
        </div>
      </div>

      <h1 id="pageTitle"></h1>
      <p class="intro" id="pageIntro"></p>
    </header>

    <form id="quizForm" class="quiz-card"></form>

    <section id="result" class="result-card">
      <div class="score">
        <div id="scoreCircle" class="score-circle">0%</div>
        <h2 id="scoreTitle"></h2>
        <p id="scoreText"></p>
      </div>

      <div class="feedback">
        <h2 id="feedbackTitle"></h2>
        <div id="wrongAnswers"></div>
      </div>

      <div class="actions">
        <button type="button" onclick="restartQuiz()" id="restartButton"></button>
      </div>
    </section>
  </main>

    let currentLanguage = "fa";
    let lastScore = null;

    const quizForm = document.getElementById("quizForm");
    const resultBox = document.getElementById("result");
    const scoreCircle = document.getElementById("scoreCircle");
    const scoreTitle = document.getElementById("scoreTitle");
    const scoreText = document.getElementById("scoreText");
    const wrongAnswers = document.getElementById("wrongAnswers");

    function changeLanguage(language) {
      saveSelectedAnswers();

      currentLanguage = language;

      document.documentElement.lang = language;
      document.documentElement.dir = language === "fa" ? "rtl" : "ltr";

      document.getElementById("faButton").classList.toggle(
        "active",
        language === "fa"
      );

      document.getElementById("enButton").classList.toggle(
        "active",
        language === "en"
      );

      renderStaticText();
      renderQuiz();

      if (lastScore) {
        renderResult(lastScore.correctCount, lastScore.wrong, lastScore.unanswered);
      }
    }

    function renderStaticText() {
      const text = translations[currentLanguage];

      document.title = text.title;
      document.getElementById("badge").textContent = text.badge;
      document.getElementById("pageTitle").textContent = text.title;
      document.getElementById("pageIntro").textContent = text.intro;
      document.getElementById("feedbackTitle").textContent = text.feedback;
      document.getElementById("restartButton").textContent = text.restart;
    }

    function saveSelectedAnswers() {
      questions.forEach((_, index) => {
        const selected = document.querySelector(
          `input[name="question-${index}"]:checked`
        );

        if (selected) {
          window[`answer_${index}`] = selected.value;
        }
      });
    }

    function renderQuiz() {
      const text = translations[currentLanguage];

      quizForm.innerHTML = questions.map((item, index) => {
        const question = item[currentLanguage];
        const savedAnswer = window[`answer_${index}`];
        const questionStatus = lastScore
          ? lastScore.correct.includes(index)
            ? "correct-answer"
            : lastScore.wrong.some(answer => answer.index === index)
              ? "wrong-answer"
              : lastScore.unanswered.some(answer => answer.index === index)
                ? "empty-answer"
                : ""
          : "";

        return `
          <div class="question ${questionStatus}" id="question-${index}">
            <div class="question-title">
              <span class="question-number">${index + 1}</span>
              <span>${question.question}</span>
            </div>

            <div class="options">
              ${question.options.map((option, optionIndex) => {
                const isChecked = String(optionIndex) === String(savedAnswer);
                const selectedClass = isChecked ? "selected" : "";

                return `
                  <label class="option ${selectedClass}">
                    <input
                      type="radio"
                      name="question-${index}"
                      value="${optionIndex}"
                      ${isChecked ? "checked" : ""}
                      onchange="selectOption(${index}, this)"
                    />
                    <span>${option}</span>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("") + `
        <div class="actions">
          <button type="button" class="main-submit" onclick="submitQuiz()">
            ${text.submit}
          </button>
        </div>
      `;
    }

    function selectOption(questionIndex, input) {
      const question = document.getElementById(`question-${questionIndex}`);

      question.classList.remove("empty-answer", "correct-answer", "wrong-answer");

      question.querySelectorAll(".option").forEach(option => {
        option.classList.remove("selected");
      });

      input.closest(".option").classList.add("selected");
      window[`answer_${questionIndex}`] = input.value;
    }

    function submitQuiz() {
      let correctCount = 0;
      const correct = [];
      const wrong = [];
      const unanswered = [];

      questions.forEach((item, index) => {
        const questionElement = document.getElementById(`question-${index}`);
        const selected = document.querySelector(
          `input[name="question-${index}"]:checked`
        );

        questionElement.classList.remove(
          "empty-answer",
          "correct-answer",
          "wrong-answer"
        );

        if (!selected) {
          questionElement.classList.add("empty-answer");

          unanswered.push({
            index,
            correctAnswer: item.answer,
            explanation: item[currentLanguage].explanation
          });

          return;
        }

        const selectedAnswer = Number(selected.value);

        if (selectedAnswer === item.answer) {
          correctCount++;
          correct.push(index);
          questionElement.classList.add("correct-answer");
        } else {
          questionElement.classList.add("wrong-answer");
          wrong.push({
            index,
            userAnswer: selectedAnswer,
            correctAnswer: item.answer,
            explanation: item[currentLanguage].explanation
          });
        }
      });

      lastScore = {
        correctCount,
        correct,
        wrong,
        unanswered
      };

      renderResult(correctCount, wrong, unanswered);

      resultBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function renderResult(correctCount, wrong, unanswered) {
      const text = translations[currentLanguage];
      const percentage = Math.round(
        (correctCount / questions.length) * 100
      );

      scoreCircle.textContent =
        currentLanguage === "fa"
          ? `${toPersianNumber(percentage)}٪`
          : `${percentage}%`;

      if (percentage >= 90) {
        scoreTitle.textContent = text.excellent;
      } else if (percentage >= 75) {
        scoreTitle.textContent = text.veryGood;
      } else if (percentage >= 50) {
        scoreTitle.textContent = text.average;
      } else {
        scoreTitle.textContent = text.weak;
      }

      scoreText.textContent = text.scoreText(
        currentLanguage === "fa"
          ? toPersianNumber(correctCount)
          : correctCount,
        currentLanguage === "fa"
          ? toPersianNumber(questions.length)
          : questions.length
      );

      let html = "";

      if (wrong.length === 0 && unanswered.length === 0) {
        html = `
          <div class="all-correct">
            ${text.allCorrect}
          </div>
        `;
      } else {
        html += wrong.map(item => {
          const question = questions[item.index][currentLanguage];

          return `
            <div class="wrong-item">
              <strong>
                ${currentLanguage === "fa" ? "سؤال" : "Question"}
                ${currentLanguage === "fa"
                  ? toPersianNumber(item.index + 1)
                  : item.index + 1}:
                ${question.question}
              </strong>

              <p>
                <b>${text.yourAnswer}:</b>
                ${question.options[item.userAnswer]}
              </p>

              <p class="correct">
                <b>${text.correctAnswers}:</b>
                ${question.options[item.correctAnswer]}
              </p>

              <p>
                <b>${text.explanation}:</b>
                ${item.explanation}
              </p>
            </div>
          `;
        }).join("");

        html += unanswered.map(item => {
          const question = questions[item.index][currentLanguage];

          return `
            <div class="wrong-item">
              <strong>
                ${currentLanguage === "fa" ? "سؤال" : "Question"}
                ${currentLanguage === "fa"
                  ? toPersianNumber(item.index + 1)
                  : item.index + 1}:
                ${question.question}
              </strong>

              <p>
                <b>${text.status}:</b>
                ${text.unanswered}
              </p>

              <p class="correct">
                <b>${text.correctAnswers}:</b>
                ${question.options[item.correctAnswer]}
              </p>

              <p>
                <b>${text.explanation}:</b>
                ${item.explanation}
              </p>
            </div>
          `;
        }).join("");
      }

      wrongAnswers.innerHTML = html;
      resultBox.classList.add("show");
    }

    function restartQuiz() {
      questions.forEach((_, index) => {
        delete window[`answer_${index}`];
      });

      lastScore = null;
      resultBox.classList.remove("show");
      renderQuiz();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function toPersianNumber(value) {
      return String(value).replace(/\d/g, digit => {
        return "۰۱۲۳۴۵۶۷۸۹"[digit];
      });
    }

    renderStaticText();
    renderQuiz();
  </script>
