                            <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاوت Workflow و Skill</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap");

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #3157d5;
      --primary-dark: #213eaa;
      --workflow: #d95d39;
      --workflow-light: #fff0eb;
      --skill: #17845b;
      --skill-light: #eaf8f1;
      --border: #e3e8f0;
      --shadow: 0 18px 45px rgba(30, 45, 75, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(49, 87, 213, 0.13), transparent 30rem),
        linear-gradient(135deg, #fbfdff, var(--bg));
      font-family: "Vazirmatn", Tahoma, sans-serif;
      line-height: 1.9;
    }

    .container {
      width: min(100% - 28px, 1100px);
      margin: auto;
    }

    header {
      padding: 38px 0 28px;
      text-align: center;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 36px;
    }

    .badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 999px;
      color: var(--primary);
      background: #e9efff;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .language-switcher {
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(30, 45, 75, 0.06);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .language-switcher button.active,
    .primary-button {
      color: #fff;
      background: var(--primary);
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.35;
    }

    .subtitle {
      max-width: 760px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .hero-answer {
      max-width: 820px;
      margin: 25px auto 0;
      padding: 18px 22px;
      border: 1px solid #dce5ff;
      border-radius: 16px;
      background: #f0f4ff;
      color: #263d8f;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .main-card {
      margin-bottom: 30px;
      padding: clamp(20px, 4vw, 40px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 22px;
      font-size: 1.5rem;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .concept-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .concept-header {
      padding: 22px;
      color: #fff;
    }

    .workflow-header {
      background: linear-gradient(135deg, #d95d39, #a93622);
    }

    .skill-header {
      background: linear-gradient(135deg, #17845b, #09613e);
    }

    .concept-header h3 {
      margin: 0 0 5px;
      font-size: 1.55rem;
    }

    .concept-header p {
      margin: 0;
      opacity: 0.9;
    }

    .concept-body {
      padding: 22px;
      background: #fff;
    }

    .concept-body p {
      margin-top: 0;
    }

    .concept-body ul {
      margin: 0;
      padding-right: 21px;
    }

    html[dir="ltr"] .concept-body ul {
      padding-right: 0;
      padding-left: 21px;
    }

    .concept-body li {
      margin: 8px 0;
    }

    .definition {
      margin: 24px 0;
      padding: 18px;
      border-radius: 14px;
      font-weight: 600;
    }

    .workflow-definition {
      background: var(--workflow-light);
      border-right: 5px solid var(--workflow);
    }

    .skill-definition {
      background: var(--skill-light);
      border-right: 5px solid var(--skill);
    }

    html[dir="ltr"] .workflow-definition,
    html[dir="ltr"] .skill-definition {
      border-right: 0;
      border-left: 5px solid;
    }

    .skill-definition {
      border-left-color: var(--skill);
    }

    .workflow-definition {
      border-left-color: var(--workflow);
    }

    .simple-analogy {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      margin: 28px 0;
    }

    .analogy-box {
      min-height: 170px;
      padding: 22px;
      border-radius: 18px;
      text-align: center;
    }

    .analogy-box h3 {
      margin-top: 0;
    }

    .workflow-analogy {
      background: var(--workflow-light);
      border: 1px solid #f5c5b8;
    }

    .skill-analogy {
      background: var(--skill-light);
      border: 1px solid #b9e4d0;
    }

    .analogy-icon {
      font-size: 2.5rem;
    }

    .arrow {
      color: var(--primary);
      font-size: 2.3rem;
      font-weight: 800;
    }

    .steps {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fbfcff;
    }

    .step-number {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
    }

    .step strong {
      display: block;
      margin-bottom: 3px;
    }

    .step span {
      color: var(--muted);
    }

    .flow-diagram {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .flow-node {
      min-width: 135px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 6px 15px rgba(30, 45, 75, 0.06);
    }

    .flow-node.workflow-node {
      border-color: #efb4a5;
      background: var(--workflow-light);
    }

    .flow-node.skill-node {
      border-color: #a8dcc2;
      background: var(--skill-light);
    }

    .flow-arrow {
      color: var(--primary);
      font-size: 1.7rem;
      font-weight: 800;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
    }

    th,
    td {
      padding: 15px;
      border: 1px solid var(--border);
      text-align: right;
      vertical-align: top;
    }

    html[dir="ltr"] th,
    html[dir="ltr"] td {
      text-align: left;
    }

    th {
      color: #fff;
      background: var(--primary);
    }

    tr:nth-child(even) td {
      background: #f8faff;
    }

    .workflow-text {
      color: var(--workflow);
      font-weight: 800;
    }

    .skill-text {
      color: var(--skill);
      font-weight: 800;
    }

    .code-example {
      direction: ltr;
      overflow-x: auto;
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      color: #dce7ff;
      background: #172033;
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.8;
      text-align: left;
      white-space: pre-wrap;
    }

    .decision-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .decision {
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .decision h3 {
      margin-top: 0;
    }

    .decision p {
      margin-bottom: 0;
      color: var(--muted);
    }

    footer {
      padding: 10px 0 35px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 750px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .language-switcher {
        align-self: center;
      }

      .comparison-grid,
      .decision-box {
        grid-template-columns: 1fr;
      }

      .simple-analogy {
        grid-template-columns: 1fr;
      }

      .arrow {
        transform: rotate(90deg);
        text-align: center;
      }

      .flow-arrow {
        transform: rotate(90deg);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="topbar">
        <span class="badge" id="badge"></span>

        <div class="language-switcher">
          <button id="faButton" onclick="changeLanguage('fa')" type="button">
            فارسی
          </button>

          <button id="enButton" onclick="changeLanguage('en')" type="button">
            English
          </button>
        </div>
      </div>

      <h1 id="pageTitle"></h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="hero-answer" id="heroAnswer"></div>
    </header>

    <section class="main-card">
      <h2 class="section-title" id="coreDifferenceTitle"></h2>

      <div class="comparison-grid">
        <article class="concept-card">
          <div class="concept-header workflow-header">
            <h3>Workflow</h3>
            <p id="workflowShortTitle"></p>
          </div>

          <div class="concept-body">
            <div class="definition" id="workflowDefinition"></div>
            <p id="workflowDescription"></p>
            <ul id="workflowList"></ul>
          </div>
        </article>

        <article class="concept-card">
          <div class="concept-header skill-header">
            <h3>Skill</h3>
            <p id="skillShortTitle"></p>
          </div>

          <div class="concept-body">
            <div class="definition" id="skillDefinition"></div>
            <p id="skillDescription"></p>
            <ul id="skillList"></ul>
          </div>
        </article>
      </div>
    </section>

    <section class="main-card">
      <h2 class="section-title" id="analogyTitle"></h2>

      <div class="simple-analogy">
        <div class="analogy-box workflow-analogy">
          <div class="analogy-icon">🗺️</div>
          <h3 id="workflowAnalogyTitle"></h3>
          <p id="workflowAnalogyText"></p>
        </div>

        <div class="arrow">↔</div>

        <div class="analogy-box skill-analogy">
          <div class="analogy-icon">🛠️</div>
          <h3 id="skillAnalogyTitle"></h3>
          <p id="skillAnalogyText"></p>
        </div>
      </div>

      <div class="hero-answer" id="analogySummary"></div>
    </section>

    <section class="main-card">
      <h2 class="section-title" id="exampleTitle"></h2>
      <p id="exampleIntro"></p>

      <div class="flow-diagram">
        <div class="flow-node workflow-node" id="nodeOne"></div>
        <div class="flow-arrow">←</div>
        <div class="flow-node skill-node" id="nodeTwo"></div>
        <div class="flow-arrow">←</div>
        <div class="flow-node skill-node" id="nodeThree"></div>
        <div class="flow-arrow">←</div>
        <div class="flow-node" id="nodeFour"></div>
      </div>

      <div class="code-example" id="codeExample"></div>
    </section>

    <section class="main-card">
      <h2 class="section-title" id="stepsTitle"></h2>
      <div class="steps" id="steps"></div>
    </section>

    <section class="main-card">
      <h2 class="section-title" id="tableTitle"></h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th id="tableConcept"></th>
              <th id="tableWorkflow"></th>
              <th id="tableSkill"></th>
            </tr>
          </thead>

          <tbody id="comparisonTable"></tbody>
        </table>
      </div>
    </section>

    <section class="main-card">
      <h2 class="section-title" id="decisionTitle"></h2>

      <div class="decision-box">
        <div class="decision">
          <h3 class="workflow-text" id="chooseWorkflowTitle"></h3>
          <p id="chooseWorkflowText"></p>
        </div>

        <div class="decision">
          <h3 class="skill-text" id="chooseSkillTitle"></h3>
          <p id="chooseSkillText"></p>
        </div>
      </div>
    </section>

    <footer id="footer"></footer>
  </main>

    let currentLanguage = "fa";

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function renderList(id, items) {
      document.getElementById(id).innerHTML = items
        .map(item => `<li>${item}</li>`)
        .join("");
    }

    function renderSteps(items) {
      document.getElementById("steps").innerHTML = items
        .map(item => {
          return `
            <div class="step">
              <div class="step-number">✓</div>
              <div>
                <strong>${item.title}</strong>
                <span>${item.text}</span>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function renderTable(rows) {
      document.getElementById("comparisonTable").innerHTML = rows
        .map(row => {
          return `
            <tr>
              <td><strong>${row[0]}</strong></td>
              <td>${row[1]}</td>
              <td>${row[2]}</td>
            </tr>
          `;
        })
        .join("");
    }

    function renderPage() {
      const data = content[currentLanguage];

      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = currentLanguage === "fa" ? "rtl" : "ltr";
      document.title = data.title;

      document.getElementById("faButton").classList.toggle(
        "active",
        currentLanguage === "fa"
      );

      document.getElementById("enButton").classList.toggle(
        "active",
        currentLanguage === "en"
      );

      setText("badge", data.badge);
      setText("pageTitle", data.title);
      setText("subtitle", data.subtitle);
      setText("heroAnswer", data.heroAnswer);

      setText("coreDifferenceTitle", data.coreDifferenceTitle);
      setText("workflowShortTitle", data.workflowShortTitle);
      setText("skillShortTitle", data.skillShortTitle);
      setText("workflowDefinition", data.workflowDefinition);
      setText("skillDefinition", data.skillDefinition);
      setText("workflowDescription", data.workflowDescription);
      setText("skillDescription", data.skillDescription);

      renderList("workflowList", data.workflowList);
      renderList("skillList", data.skillList);

      setText("analogyTitle", data.analogyTitle);
      setText("workflowAnalogyTitle", data.workflowAnalogyTitle);
      setText("workflowAnalogyText", data.workflowAnalogyText);
      setText("skillAnalogyTitle", data.skillAnalogyTitle);
      setText("skillAnalogyText", data.skillAnalogyText);
      setText("analogySummary", data.analogySummary);

      setText("exampleTitle", data.exampleTitle);
      setText("exampleIntro", data.exampleIntro);
      setText("nodeOne", data.nodeOne);
      setText("nodeTwo", data.nodeTwo);
      setText("nodeThree", data.nodeThree);
      setText("nodeFour", data.nodeFour);
      setText("codeExample", data.codeExample);

      setText("stepsTitle", data.stepsTitle);
      renderSteps(data.steps);

      setText("tableTitle", data.tableTitle);
      setText("tableConcept", data.tableConcept);
      setText("tableWorkflow", data.tableWorkflow);
      setText("tableSkill", data.tableSkill);
      renderTable(data.tableRows);

      setText("decisionTitle", data.decisionTitle);
      setText("chooseWorkflowTitle", data.chooseWorkflowTitle);
      setText("chooseWorkflowText", data.chooseWorkflowText);
      setText("chooseSkillTitle", data.chooseSkillTitle);
      setText("chooseSkillText", data.chooseSkillText);
      setText("footer", data.footer);
    }

    function changeLanguage(language) {
      currentLanguage = language;
      renderPage();
    }

    renderPage();
  </script>
